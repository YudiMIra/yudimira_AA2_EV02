<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Informes</title>

    <style>
        body {
            background: #f5f7fa;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background: #34495e;
            padding: 25px;
            color: white;
            text-align: center;
            font-size: 26px;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        /* BOTÓN */
        .btn-primary {
            background: #3498db;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            margin: 15px auto 25px auto;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        /* TABLA */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #34495e;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f1f1f1;
        }

        /* LINK VOLVER */
        .volver {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2980b9;
            text-decoration: none;
            font-size: 16px;
        }

        .volver:hover {
            color: #1c5986;
        }
    </style>
</head>

<body>

<header>
    <h1>Informes</h1>
</header>

<div class="container">

    <section>
        <h2>Ventas por producto</h2>

        <button class="btn-primary" onclick="loadInforme()">Generar informe</button>

        <table id="informeTable">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Total Vendido</th>
                    <th>Ingresos</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <a class="volver" href="index.html">⬅ Volver</a>

</div>

<script>
async function loadInforme() {
    const res = await fetch('/api/informes/ventas-por-producto');
    const data = await res.json();

    const tbody = document.querySelector('#informeTable tbody');
    tbody.innerHTML = '';

    data.forEach(r => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${r.nombre}</td>
            <td>${r.total_vendido}</td>
            <td>${r.total_ingresos}</td>
        `;

        tbody.appendChild(tr);
    });
}
</script>

</body>
</html>
