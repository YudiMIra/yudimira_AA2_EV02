<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Productos</title>

    <style>
        body {
            background: #f5f7fa;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background: #34495e;
            padding: 25px;
            color: white;
            text-align: center;
            font-size: 26px;
        }

        .container {
            width: 85%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
        }

        /* FORMULARIO */
        .form-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-row input {
            padding: 9px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-primary {
            background: #3498db;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        /* TABLA */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #34495e;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2980b9;
            text-decoration: none;
            font-size: 16px;
        }

        .volver:hover {
            color: #1c5986;
        }
    </style>
</head>

<body>

<header>
    <h1>Productos</h1>
</header>

<div class="container">

    <section>
        <h2>Crear producto</h2>

        <div class="form-row">
            <input id="nombre" placeholder="Nombre">
            <input id="descripcion" placeholder="Descripción">
            <input id="precio" placeholder="Precio" type="number">
            <input id="stock" placeholder="Stock" type="number">
            <input id="proveedor_id" placeholder="Proveedor ID" type="number">
            <button class="btn-primary" onclick="createProducto()">Crear</button>
        </div>
    </section>

    <section>
        <h2>Lista de productos</h2>

        <table id="productosTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <a class="volver" href="index.html">⬅ Volver</a>

</div>

<!-- SCRIPT -->
<script>
async function loadProductos() {
    const res = await fetch('/api/productos');
    const data = await res.json();

    const tbody = document.querySelector('#productosTable tbody');
    tbody.innerHTML = '';

    data.forEach(p => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${p.id}</td>
            <td>${p.nombre}</td>
            <td>${p.precio}</td>
            <td>${p.stock}</td>
            <td>
                <button class="btn-delete" onclick="deleteProducto(${p.id})">Eliminar</button>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

async function createProducto() {
    const nombre = document.getElementById('nombre').value;
    const descripcion = document.getElementById('descripcion').value;
    const precio = parseFloat(document.getElementById('precio').value || 0);
    const stock = parseInt(document.getElementById('stock').value || 0);
    const proveedor_id = parseInt(document.getElementById('proveedor_id').value || 0);

    await fetch('/api/productos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, descripcion, precio, stock, proveedor_id })
    });

    loadProductos();
}

async function deleteProducto(id) {
    if (!confirm('¿Eliminar producto?')) return;

    await fetch('/api/productos/' + id, { method: 'DELETE' });

    loadProductos();
}

window.onload = loadProductos;
</script>

</body>
</html>
