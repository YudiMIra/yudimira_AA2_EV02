<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Ventas</title>

    <style>

        body {
            background: #f5f7fa;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background: #34495e;
            padding: 25px;
            color: white;
            text-align: center;
            font-size: 26px;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        /* FORMULARIO */
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .form-row input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 10px 18px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2773a5;
        }

        /* TABLA */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #34495e;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ececec;
        }

        tr:hover {
            background: #f4f4f4;
        }

        /* VOLVER */
        .volver {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2980b9;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .volver:hover {
            color: #1c5986;
        }

    </style>
</head>

<body>

<header>
    <h1>Ventas</h1>
</header>

<div class="container">

    <section>
        <h2>Crear venta</h2>

        <div class="form-row">
            <input id="cliente_id" placeholder="Cliente ID" type="number">
            <input id="usuario_id" placeholder="Usuario ID" type="number" value="1">
            <input id="items"
                placeholder='Items JSON: [{"producto_id":1,"cantidad":2,"precio":100}]'
                style="width:100%">
            <button onclick="createVenta()">Crear Venta</button>
        </div>

    </section>

    <section>
        <h2>Lista de ventas</h2>

        <table id="ventasTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Usuario</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <a class="volver" href="index.html">⬅ Volver</a>

</div>

<script>
async function loadVentas() {
    const res = await fetch('/api/ventas');
    const data = await res.json();

    const tbody = document.querySelector('#ventasTable tbody');
    tbody.innerHTML = '';

    data.forEach(v => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${v.id}</td>
            <td>${v.fecha}</td>
            <td>${v.cliente}</td>
            <td>${v.usuario}</td>
        `;

        tbody.appendChild(tr);
    });
}

async function createVenta() {
    try {
        const cliente_id = parseInt(document.getElementById('cliente_id').value || 0);
        const usuario_id = parseInt(document.getElementById('usuario_id').value || 1);
        const items = JSON.parse(document.getElementById('items').value || '[]');

        await fetch('/api/ventas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cliente_id, usuario_id, items })
        });

        loadVentas();

    } catch (e) {
        alert("Error en formato de items: " + e.message);
    }
}

window.onload = loadVentas;
</script>

</body>
</html>
